function useIsMobile() {
  const [mobile, setMobile] = useState(window.innerWidth < 768);
  useEffect(() => {
    const h = () => setMobile(window.innerWidth < 768);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return mobile;
}

/* ── 파생 텍스트 ── */
function langNames(d){
  var names = (d.langs||[]).slice();
  if(d.langCustom){
    d.langCustom.split(/[\/,·]+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){names.push(s);});
  }
  return names;
}
function langText(d){
  var names = langNames(d);
  if(!names.length) return "(언어 미선택)";
  if(names.length===1) return names[0];
  if(names.length===2) return names.join("·");
  return names.slice(0,2).join("·")+" 등 "+names.length+"개 언어";
}
function fieldObjs(d){
  var arr = (d.tourFields||[]).map(function(id){return FIELDS.find(function(f){return f.id===id;});}).filter(Boolean);
  if(d.fieldCustom) arr.push({id:"custom", label:d.fieldCustom, phrase:d.fieldCustom+"을(를) 전문으로 안내하는", prod:d.fieldCustom});
  return arr;
}
function fieldText(d){
  var f = fieldObjs(d);
  return f.length ? f.map(function(x){return x.label;}).join("·") : "(전문 분야 미선택)";
}
function targetText(d){
  return (d.targets||[]).map(function(id){var t=TARGETS.find(function(x){return x.id===id;});return t?t.label:"";}).filter(Boolean).join(", ");
}
function modeObj(d){ return MODES.find(function(m){return m.id===d.mode;}); }
function jobLabel(d){
  var f = fieldText(d);
  return "관광통역안내사 ("+langText(d)+" / "+f+")";
}

/* ─────────────────────────── 프로필 포맷 ─────────────────────────── */
function fmtLines(txt, prefix){
  var out = [];
  String(txt||"").split("\n").forEach(function(line){ if(line.trim()) out.push((prefix||"- ") + line.trim()); });
  return out;
}

function fmtProfile(d) {
  var L = [];
  var mo = modeObj(d);
  L.push("■ 기본 정보");
  L.push("- 이름: " + (d.name||"(미입력)"));
  L.push("- 보유 자격: 국가공인 관광통역안내사");
  L.push("- 안내 가능 언어: " + (langNames(d).join(", ")||"(미입력)") + (d.langLevel?(" — 수준: "+d.langLevel):""));
  L.push("- 활동 방향: " + (mo?mo.label:"(미선택)") + (d.role?(" / 목표 포지션: "+d.role):""));
  if(d.birth) L.push("- 생년월일: " + d.birth);
  if(d.phone) L.push("- 연락처: " + d.phone);
  if(d.email) L.push("- 이메일: " + d.email);
  if(d.address) L.push("- 거주지: " + d.address);
  if(d.homepage) L.push("- 홈페이지/SNS: " + d.homepage);
  if(d.oneWord) L.push("- 나를 한 단어로: " + d.oneWord);
  L.push("");
  L.push("■ 전문 투어·타깃 고객 (★ 이 이력서의 간판 — 결과물 전체에 반드시 드러낼 것)");
  L.push("- 전문 투어 분야: " + fieldText(d));
  var fo = fieldObjs(d);
  if(fo.length) L.push("- 대표 투어 콘텐츠: " + fo.map(function(x){return x.prod;}).join(" / "));
  L.push("- 함께하고 싶은 손님: " + (targetText(d)||"(미선택)"));
  if(d.signatureTour) L.push("- 하고 싶은·하고 있는 시그니처 투어: " + d.signatureTour.replace(/\n+/g," / "));
  if(d.proofNum) L.push("- 나를 증명하는 숫자: " + d.proofNum);
  L.push("");
  L.push("■ 학력 (한 줄 = 학력 1개)");
  var edu = fmtLines(d.education);
  if(edu.length) L = L.concat(edu); else L.push("- (미입력)");
  L.push("");
  L.push("■ 자격·어학·툴");
  L.push("- 관광통역안내사 (국가공인)");
  var cert = fmtLines(d.certifications);
  if(cert.length) L = L.concat(cert);
  if(d.languages) L.push("- 공인 어학: " + d.languages);
  if(d.tools) L.push("- 사용 가능 툴: " + d.tools);
  L.push("");
  L.push("■ 경력·경험 (여러 개 — 이력서 경력 섹션의 재료. 관광 무관 경력도 가이드 역량으로 번역할 것)");
  var star = d.starIndex;
  d.expList.forEach(function(e, i){
    var has = e.org||e.duty||e.numbers;
    if(!has) return;
    L.push("[경험 " + (i+1) + "]" + (i===star?" ★ 대표 경험":""));
    var ty = (e.type==="직접 입력") ? (e.typeCustom || "") : e.type;
    if(ty)       L.push("- 유형: " + ty);
    if(e.org)    L.push("- 회사·기관·활동명: " + e.org);
    if(e.period) L.push("- 기간: " + e.period);
    if(e.title)  L.push("- 직위·역할: " + e.title);
    if(e.duty)   L.push("- 담당 업무(한 일): " + e.duty);
    if(e.numbers)L.push("- 숫자로 센 성과·규모: " + e.numbers);
    if(e.link)   L.push("- 가이드 직무와의 연결(본인 생각): " + e.link);
    L.push("");
  });
  L.push("■ 대표 경험 심화 (자소서 핵심 경험용)");
  var se = d.expList[star] || {};
  if(se.org) L.push("- 대상 경험: " + se.org + (se.period?(" ("+se.period+")"):""));
  if(d.starSituation) L.push("- [상황/배경] " + d.starSituation);
  if(d.starAction)    L.push("- [행동(무엇을/어떻게)] " + d.starAction);
  if(d.starResult)    L.push("- [결과(비포→애프터)] " + d.starResult);
  L.push("");
  L.push("■ 기타 활동 (이력서 '기타 활동 경력' 섹션의 재료)");
  var a1 = fmtLines(d.actTeach,   "- [강의·발표·교육] ");
  var a2 = fmtLines(d.actAward,   "- [수상·평가·인증] ");
  var a3 = fmtLines(d.actContent, "- [집필·콘텐츠·SNS] ");
  var a4 = fmtLines(d.actEtc,     "- [봉사·모임·루틴 등] ");
  var acts = a1.concat(a2, a3, a4);
  if(acts.length) L = L.concat(acts); else L.push("- (없음)");
  L.push("");
  L.push("■ 나만의 이야기 · 강점 · 가치관 (워크시트 — 차별화의 핵심. 결과물에 반드시 녹여낼 것)");
  if(d.motivation) L.push("- [시작한 계기·지원 동기] " + d.motivation.replace(/\n+/g," / "));
  if(d.styleNow) L.push("- [현재 활동·해설 스타일] " + d.styleNow.replace(/\n+/g," / "));
  if(d.differentiator) L.push("- [나만의 차별화 포인트] " + d.differentiator.replace(/\n+/g," / "));
  if(d.custValue) L.push("- [고객에게 주는 특별한 가치] " + d.custValue.replace(/\n+/g," / "));
  if(d.promise) L.push("- [손님에게 건네는 약속 한 문장] " + d.promise.replace(/\n+/g," / "));
  if(d.expStrengths && d.expStrengths.length) L.push("- 강점 키워드: " + d.expStrengths.join(", "));
  if(d.workValue) L.push("- 일하는 원칙: " + d.workValue);
  if(d.aspiration) L.push("- 앞으로의 목표: " + d.aspiration);
  return L.join("\n");
}

  ];
}

function completion(d) {
  var e0 = d.expList[0] || {};
  var anyNum = d.expList.some(function(e){return e.numbers && e.numbers.trim();});
  var checks = [
    !!d.name, !!(d.langs.length || d.langCustom), !!d.mode,
    !!(d.tourFields.length || d.fieldCustom), !!d.targets.length,
    !!(d.education.trim() || d.certifications.trim()),
    !!(e0.org && e0.duty), anyNum,
    !!d.starAction, !!d.starResult,
    !!d.motivation, !!d.differentiator,
  ];
  var filled = checks.filter(Boolean).length;
  return Math.round(filled/checks.length*100);
}

function SH({eyebrow, title, sub, time}) {

const IS = {width:"100%",border:"1px solid #DDDDDD",borderRadius:9,padding:"10px 12px",fontSize:13.5,color:"#222222",background:"#fff",lineHeight:1.6};
function TI({val, set, ph}) { return <input type="text" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS}/>; }
function TA({val, set, ph, rows=3}) { return <textarea value={val} onChange={e=>set(e.target.value)} placeholder={ph} rows={rows} style={IS}/>; }
function Grid2({m, children}) { return <div style={{display:"grid",gridTemplateColumns:m?"1fr":"1fr 1fr",gap:12}}>{children}</div>; }

function Notice({ico, tone, children}) {
  var bg = tone==="warn"?C.warnBg:tone==="good"?C.goodBg:C.accentBg;
  var bd = tone==="warn"?C.warn:tone==="good"?C.good:C.accent;
  return (
    <div style={{background:bg,border:"1px solid "+bd,borderRadius:10,padding:"11px 14px",marginBottom:20,display:"flex",gap:9,alignItems:"flex-start"}}>

        <TI val={e.link} set={function(v){updExp(i,"link",v);}} ph="예: 30개국 바이어 응대 → 외국 문화를 이해하는 글로벌 감각으로 연결"/>

      <F label="② 지금 하고 있는 활동 · 해설 스타일" opt hint="내가 활동하는 분야, 콘텐츠, 해설 방식은 어떤가요? (워크시트 2번)">

        <TA rows={2} val={d.differentiator} set={function(v){u("differentiator",v);}} ph={EX.diff}/>
      </F>
      <F label="④ 고객에게 주는 특별한 가치" opt hint="손님이 나를 선택하면 얻는 특별한 경험은 무엇인가요? (워크시트 3번)">
        <TA rows={2} val={d.custValue} set={function(v){u("custValue",v);}} ph={EX.custValue}/>
      </F>
      <F label="⑤ 손님에게 건네는 약속 한 문장" opt hint="명함·SNS·자기소개 마무리에 그대로 쓰입니다. 짧고 진심이 담기게.">
        <TA rows={2} val={d.promise} set={function(v){u("promise",v);}} ph={EX.promise}/>

      <p style={{color:C.muted,fontSize:12,lineHeight:1.6,margin:"0 0 14px"}}>전부 채우는 칸이 <b>아닙니다</b>. 있는 것만 골라 한 줄에 하나씩 적고, 해당 없으면 통째로 건너뛰세요. 숫자(횟수·인원·기간)가 있으면 함께.</p>

        </F>
        <F label="봉사·모임·루틴·기타" opt>
          <TA rows={3} val={d.actEtc} set={function(v){u("actEtc",v);}} ph={"관광안내 자원봉사 12회\n매일 영어 회화 스터디 6개월째"}/>

      <F label="나의 강점 키워드 (최대 5개)" req hint="경험들을 관통하는 강점을 고르세요.">
        {STRENGTH_GROUPS.map(function(grp){
          return (
            <div key={grp.g} style={{marginBottom:9}}>
              <div style={{fontSize:11,fontWeight:700,color:C.faint,marginBottom:5}}>{grp.g}</div>

      <F label="나를 한 단어로" opt>

          display:"flex",alignItems:"center",justifyContent:"center",gap:7,
          boxShadow:done?"none":"0 3px 12px rgba(255,56,92,0.28)"

      <div style={{flex:1,padding:"12px 14px",fontSize:12.5,lineHeight:1.6,color:has?C.ink:C.faint,whiteSpace:"pre-wrap"}}>{has?val:ph}</div>

}

          <span style={{color:"rgba(255,255,255,0.5)",fontSize:11}}>관광통역안내사 프롬프트 메이커</span>

          </div>
        </div>
        <div style={{fontSize:11.5,fontWeight:700,color:"#1A1A1A"}}>open.kakao.com/me/yosepAI</div>

      <SH eyebrow="STEP 06 · 완성" title="나만의 프롬프트 4종이 완성됐습니다"
        sub="반드시 '하나의 채팅창'에서 순서대로 사용하세요. 앞 결과물이 뒤 프롬프트의 재료가 되고, 마지막 통합 프롬프트는 파일 첨부 없이 최종 통합 문서를 만들어 줍니다. 클로드 사용을 권장합니다 — 워드 파일까지 바로 받을 수 있습니다."/>
      <div style={{border:"1.5px solid "+C.ink,borderRadius:14,padding:"16px 18px",marginBottom:20,background:"#fff"}}>
        <div style={{fontWeight:800,fontSize:13.5,color:C.ink,marginBottom:11}}>🗺️ 사용 순서 — 한 채팅창에서 차례대로</div>
        {FLOW.map(function(f,i){
          return (
            <div key={i} style={{display:"flex",gap:9,alignItems:"flex-start",marginBottom:i<FLOW.length-1?8:0}}>
              <span style={{color:C.accent,fontWeight:800,fontSize:13,flexShrink:0}}>{f.n}</span>
              <span style={{fontSize:12.5,color:C.ink,lineHeight:1.6}}>{f.t}</span>
            </div>
          );
        })}
      </div>
      <div style={{background:pct>=60?C.goodBg:C.warnBg,border:"1px solid "+(pct>=60?C.good:C.warn),borderRadius:10,padding:"11px 14px",marginBottom:22,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20,flexShrink:0}}>{pct>=60?"✅":"📝"}</span>
        <div style={{fontSize:12.5,color:C.ink,lineHeight:1.5}}>
          <strong>입력 완성도 {pct}%</strong> — {pct>=60?"충분합니다. 프롬프트를 바로 사용하세요.":"앞 단계를 조금 더 채우면 결과가 좋아집니다. 특히 전문 분야·타깃 손님과 경험별 '숫자' 칸이 중요합니다."}
        </div>
      </div>
      {prompts.map(function(p,i){
        return (
          <React.Fragment key={p.id}>
            {p.id==="p3" && (
              <div style={{border:"1px solid "+C.border,borderRadius:14,padding:"15px 16px",marginBottom:12,background:C.canvas}}>
                <div style={{fontWeight:800,fontSize:13,color:C.ink,marginBottom:9,display:"flex",alignItems:"center",gap:7}}>📁 포트폴리오를 어디에 만들까요?</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {[{k:"notion",t:"노션 제출용"},{k:"ppt",t:"PPT 변환용"}].map(function(o){
                    var on = (d.pfFormat||"notion")===o.k;
                    return (
                      <button key={o.k} onClick={function(){u("pfFormat",o.k);}}
                        style={{border:"1.5px solid "+(on?C.accent:C.border),background:on?C.accentBg:"#fff",color:on?C.accent:C.muted,
                          borderRadius:9,padding:"9px 16px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{on?"✓ ":""}{o.t}</button>
                    );
                  })}
                </div>
              </div>
            )}
            {p.id==="p4" && (
              <Notice ico="📎">
                <b>사용법</b> — 서식 파일을 첨부할 필요가 없습니다. 위에서 만든 ①이력서 ②자기소개서 ③포트폴리오 결과물이 같은 채팅창에 있는 상태에서, 이 프롬프트만 이어서 붙여넣으세요. 서식(색·폰트·여백·차트)이 프롬프트 안에 규격으로 들어 있어, 바로 제출 가능한 A4 3페이지 문서로 나옵니다.
              </Notice>
            )}
            <PCard num={i+1} ico={p.ico} title={p.title} usage={p.usage} tip={p.tip} content={p.content}
              done={copied===p.id} onCopy={function(){onCopy(p.content, p.id);}}/>
          </React.Fragment>
        );
      })}
      <div style={{margin:"26px 0 18px"}}><Summary d={d}/></div>
      <button onClick={onReset}
        style={{width:"100%",border:"1px solid "+C.border,background:"#fff",color:C.muted,borderRadius:10,padding:"12px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>
        🔄 처음부터 다시 시작 (모든 입력 초기화)
      </button>
    </>
  );
}

/* ─────────────────────────── App ─────────────────────────── */
function App() {
  var _s = useState(1); var step = _s[0]; var setStep = _s[1];
  var _d = useState(INIT); var data = _d[0]; var setData = _d[1];
  var _c = useState(null); var copied = _c[0]; var setCopied = _c[1];
  var isMobile = useIsMobile();

  var upd = useCallback(function(key, val){ setData(function(p){ var n={...p}; n[key]=val; return n; }); },[]);
  var updExp = useCallback(function(i, key, val){
    setData(function(p){
      var list = p.expList.map(function(e,idx){ return idx===i ? {...e, [key]:val} : e; });
      return {...p, expList:list};
    });
  },[]);
  var addExp = useCallback(function(){
    setData(function(p){ return p.expList.length>=6 ? p : {...p, expList:p.expList.concat([newExp()])}; });
  },[]);
  var delExp = useCallback(function(i){
    setData(function(p){
      if(p.expList.length<=1) return p;
      var list = p.expList.filter(function(_,idx){return idx!==i;});
      var star = p.starIndex;
      if(star===i) star = 0;
      else if(star>i) star = star-1;
      return {...p, expList:list, starIndex:star};
    });
  },[]);
  var reset = useCallback(function(){
    if(window.confirm("모든 입력이 초기화됩니다. 처음부터 다시 시작할까요?")){
      setData({...INIT, langs:[], targets:[], tourFields:[], expStrengths:[], expList:[newExp()]});
      setCopied(null); setStep(1);
    }
  },[]);

  useEffect(function(){ window.scrollTo({top:0,behavior:"smooth"}); },[step]);
  function copyPrompt(text,id){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ setCopied(id); setTimeout(function(){setCopied(null);},2200); })
        .catch(function(){ fallbackCopy(text,id); });
    } else fallbackCopy(text,id);
  }
  function fallbackCopy(text,id){
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); setCopied(id); setTimeout(function(){setCopied(null);},2200);}catch(e){}
    document.body.removeChild(ta);
  }

  var pct = step/STEPS.length*100;

  var Sidebar = (
    <aside style={{position:"sticky",top:70,height:"fit-content",width:208,flexShrink:0}}>
      <div style={{color:C.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>진행 단계 {step}/{STEPS.length}</div>
      <ol style={{listStyle:"none",margin:0,padding:0}}>
        {STEPS.map(function(s){
          var active=s.id===step, done=s.id<step;
          return (
            <li key={s.id} style={{marginBottom:3}}>
              <button onClick={function(){setStep(s.id);}}
                style={{width:"100%",textAlign:"left",border:"none",borderRadius:9,padding:"9px 11px",display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",
                  background:active?C.ink:"transparent",color:active?"#fff":done?C.ink:C.muted}}>
                <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0,marginTop:1,
                  background:active?"#fff":done?C.accent:C.borderSoft,color:active?C.ink:done?"#fff":C.muted}}>{done?"✓":s.id}</div>
                <div>
                  <div style={{fontWeight:600,fontSize:12.5,lineHeight:1.3}}>{s.label}</div>
                  <div style={{fontSize:10.5,opacity:0.6,marginTop:2,lineHeight:1.3}}>{s.sub}</div>
                </div>
              </button>
            </li>
          );
        })}
      </ol>
    </aside>
  );

  var MobileStepBar = (
    <div style={{background:C.panel,borderBottom:"1px solid "+C.border,padding:"10px 0 0"}}>
      <div className="step-scroll" style={{padding:"0 16px 10px",display:"flex",gap:7}}>
        {STEPS.map(function(s){
          var active=s.id===step, done=s.id<step;
          return (
            <button key={s.id} onClick={function(){setStep(s.id);}}
              style={{flexShrink:0,display:"flex",alignItems:"center",gap:5,border:"none",borderRadius:20,padding:"6px 13px",cursor:"pointer",
                background:active?C.ink:done?C.accentBg:C.borderSoft,color:active?"#fff":done?C.accent:C.muted,
                fontSize:11.5,fontWeight:700,whiteSpace:"nowrap",boxShadow:active?"0 2px 8px rgba(0,0,0,0.15)":"none"}}>
              <span style={{width:18,height:18,borderRadius:"50%",background:active?"rgba(255,255,255,0.2)":done?C.accent:"rgba(0,0,0,0.08)",color:active?"#fff":done?"#fff":C.muted,
                display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900,flexShrink:0}}>{done?"✓":s.id}</span>
              {s.label}
            </button>
          );
        })}
      </div>
      <div style={{height:3,background:C.borderSoft}}><div style={{width:pct+"%",height:"100%",background:C.accent,transition:"width 0.4s ease"}}/></div>
    </div>
  );

  return (
    <div style={{background:C.canvas,minHeight:"100vh",color:C.ink}}>
      <header style={{borderBottom:"1px solid "+C.border,background:C.panel,position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:isMobile?"11px 16px":"13px 22px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{background:C.accent,width:34,height:34,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🧭</div>
            <div>
              <div style={{fontWeight:800,fontSize:isMobile?13:14.5,letterSpacing:"-0.02em",lineHeight:1.2}}>관광통역안내사 프롬프트 메이커</div>
              {!isMobile && <div style={{color:C.muted,fontSize:11,marginTop:1}}>질문에 답하면 이력서→자소서→포트폴리오→통합 문서 프롬프트가 한 번에</div>}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{color:C.accent,fontWeight:800,fontSize:13}}>{step}</span>
            <span style={{color:C.faint,fontSize:12}}>/ {STEPS.length}</span>
            <span style={{color:C.muted,fontSize:11,marginLeft:4,display:isMobile?"none":"inline"}}>{STEPS[step-1].label}</span>
          </div>
        </div>
        {!isMobile && <div style={{height:3,background:C.borderSoft}}><div style={{width:pct+"%",height:"100%",background:C.accent,transition:"width 0.4s ease"}}/></div>}
      </header>

      {isMobile && MobileStepBar}

      <div style={{maxWidth:1100,margin:"0 auto",padding:isMobile?"16px 12px":"26px 22px",display:isMobile?"block":"flex",gap:24,alignItems:"flex-start"}}>
        {!isMobile && Sidebar}
        <main style={{flex:1,minWidth:0}}>
          <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:isMobile?14:18,padding:isMobile?"20px 16px":34}}>
            {step===1 && <S1 d={data} u={upd} m={isMobile}/>}
            {step===2 && <S2 d={data} u={upd} m={isMobile}/>}
            {step===3 && <S3 d={data} u={upd} m={isMobile}/>}
            {step===4 && <S4 d={data} u={upd} m={isMobile} updExp={updExp} addExp={addExp} delExp={delExp}/>}
            {step===5 && <S5 d={data} u={upd} m={isMobile}/>}
            {step===6 && <S6 d={data} u={upd} copied={copied} onCopy={copyPrompt} onReset={reset}/>}
            <div style={{borderTop:"1px solid "+C.border,marginTop:28,paddingTop:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <button onClick={function(){setStep(function(s){return Math.max(1,s-1);});}} disabled={step===1}
                style={{border:"1px solid "+C.border,background:"transparent",color:step===1?C.faint:C.ink,borderRadius:8,padding:isMobile?"10px 16px":"9px 18px",fontSize:13,fontWeight:600,cursor:step===1?"not-allowed":"pointer"}}>← 이전</button>
              <span style={{color:C.faint,fontSize:12}}>{step} / {STEPS.length}</span>
              {step<STEPS.length
                ? <button onClick={function(){setStep(function(s){return Math.min(STEPS.length,s+1);});}}
                    style={{background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:isMobile?"10px 18px":"9px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>다음 →</button>
                : <span style={{fontSize:12.5,color:C.good,fontWeight:700}}>✨ 완성!</span>}
            </div>
          </div>
          <footer style={{textAlign:"center",padding:"22px 0 30px",color:C.faint,fontSize:11.5,lineHeight:1.7}}>
            요셉쌤 AI문서연구소 · 관광통역안내사 프롬프트 메이커<br/>
            문의 : <a href={KAKAO} target="_blank" rel="noopener" style={{color:C.accent,fontWeight:600,textDecoration:"none"}}>카카오 오픈채팅</a>
            <span style={{margin:"0 6px",color:C.faint}}>｜</span>
            <a href={HOME} target="_blank" rel="noopener" style={{color:C.accent,fontWeight:600,textDecoration:"none"}}>홍요셉 강사 공식홈페이지</a>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
